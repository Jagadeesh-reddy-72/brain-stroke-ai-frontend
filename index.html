<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroView AI · Stroke Detection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- simple header -->
    <header class="app-header">
        <h2>🧠 NeuroView AI · stroke</h2>
        <span class="badge">research use · DWI</span>
    </header>

    <!-- main container -->
    <main class="main">
        <div class="card">
            <!-- title area -->
            <div class="title">
                <span class="icon">📊</span>
                <h1>Diffusion MRI analysis</h1>
            </div>

            <!-- upload section : file input + analyze button -->
            <div class="upload-row">
                <label for="fileInput" class="file-label">
                    <span>📁</span> Choose MRI
                </label>
                <input type="file" id="fileInput" accept="image/*">
                <span class="filename" id="fileNameDisplay">No file selected</span>
                <button class="analyze-btn" id="analyzeBtn">
                    <span>🔬</span> Analyze
                </button>
            </div>

            <!-- preview area – initially empty (hidden until image selected) -->
            <div id="preview" class="preview-panel hidden">
                <div class="preview-header">
                    <span>🖼️</span> <span>Uploaded image</span>
                </div>
                <div class="image-container" id="imageContainer">
                    <!-- image will be injected here via JS -->
                </div>
            </div>

            <!-- result area – initially empty/placeholder -->
            <div id="result" class="result-area">
                <div class="small-note" style="text-align: center; opacity:0.7;">⏳ No analysis yet. Upload and click
                    Analyze.</div>
            </div>

            <!-- subtle footer inside card -->
            <div class="footer-note">
                <span>🧪 backend: stroke-predict.hf.space</span>
                <span>v1.0 · instant preview</span>
            </div>
        </div>
    </main>

    <!-- simple footer -->
    <footer class="app-footer">
        AI stroke detection · interface only
    </footer>

    <script src="main.js"></script>
</body>

</html>
